[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walgreens-photo-prints"
version = "1.0.0"
description = "Python client and CLI for the Walgreens Native Photo Prints API v3: upload credentials, products, coupons, store search, order submit, and order status."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "enonymous1" }]
keywords = ["walgreens", "photo-prints", "api-client", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "python-dotenv==1.2.4",
    "requests==2.32.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
walgreens-prints = "walgreens_photo_prints.cli:main"

[project.urls]
Homepage = "https://github.com/enonymous1/walgreens-photo-prints"
Repository = "https://github.com/enonymous1/walgreens-photo-prints"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
