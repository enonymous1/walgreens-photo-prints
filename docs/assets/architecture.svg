<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img" aria-label="Architecture: CLI and library read credentials from the environment, call the six Walgreens v3 endpoints through the client, and upload images to cloud storage via a signed URL">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f1f5f9; stroke: #334155; stroke-width: 1.5; rx: 10; }
      .title { font-family: sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .sub { font-family: sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .line { stroke: #334155; stroke-width: 1.5; marker-end: url(#arrow); }
      .note { font-family: sans-serif; font-size: 13px; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect class="box" x="10" y="70" width="160" height="70"/>
  <text class="title" x="90" y="98">CLI / Library</text>
  <text class="sub" x="90" y="118">walgreens-prints</text>
  <line class="line" x1="170" y1="105" x2="195" y2="105"/>
  <rect class="box" x="195" y="70" width="160" height="70"/>
  <text class="title" x="275" y="98">Config</text>
  <text class="sub" x="275" y="118">env / .env, key redacted</text>
  <line class="line" x1="355" y1="105" x2="380" y2="105"/>
  <rect class="box" x="380" y="70" width="160" height="70"/>
  <text class="title" x="460" y="98">WalgreensClient</text>
  <text class="sub" x="460" y="118">timeout, error handling</text>
  <line class="line" x1="540" y1="105" x2="565" y2="105"/>
  <rect class="box" x="565" y="70" width="170" height="70"/>
  <text class="title" x="650" y="98">Walgreens v3 API</text>
  <text class="sub" x="650" y="118">six endpoints</text>
  <line class="line" x1="735" y1="105" x2="760" y2="105"/>
  <rect class="box" x="760" y="70" width="150" height="70"/>
  <text class="title" x="835" y="98">Cloud storage</text>
  <text class="sub" x="835" y="118">SAS upload URL</text>
  <text class="note" x="460" y="190">Submit requires --confirm and --accept-terms. No automatic retry on submit.</text>
  <text class="note" x="460" y="212">Sandbox is the default base URL. Production requires an explicit opt-in.</text>
</svg>
